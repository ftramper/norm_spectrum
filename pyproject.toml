[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "norm-spectrum"
version = "1.0.0"
description = "Lightweight normalization tools for astronomical spectra"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Frank Tramper"}]
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
]
keywords = ["astronomy", "spectroscopy", "normalization", "continuum"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/ftramper/norm_spectrum"

[tool.setuptools.packages.find]
where = ["src"]
